[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentineltrace-backend"
version = "0.1.0"
description = "SentinelTrace — AI-Assisted Email Threat Detection Platform Backend"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ── Web Framework ───────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",

    # ── Database ────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # ── Neo4j ───────────────────────────────────────────────────────────────
    "neo4j>=5.26.0",

    # ── Redis & Background Jobs ─────────────────────────────────────────────
    "redis>=5.2.0",
    "fastapi-limiter>=0.1.6",
    "celery>=5.4.0",

    # ── Auth & Security ─────────────────────────────────────────────────────
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "authlib>=1.3.2",

    # ── Validation ──────────────────────────────────────────────────────────
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ── Email Parsing ───────────────────────────────────────────────────────
    "mail-parser>=3.15.0",
    "chardet>=5.2.0",

    # ── AI / LLM ────────────────────────────────────────────────────────────
    "openai>=1.55.0",

    # ── Google Cloud ────────────────────────────────────────────────────────
    "google-cloud-storage>=2.19.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.155.0",

    # ── Logging ─────────────────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ── PDF / Reporting ─────────────────────────────────────────────────────
    "reportlab>=4.2.5",
    "Pillow>=11.0.0",

    # ── Utilities ───────────────────────────────────────────────────────────
    "python-dateutil>=2.9.0",
    "geoip2>=5.0.0",
    "ipaddress>=1.0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
