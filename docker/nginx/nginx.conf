user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with upstream tracking & response times
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" upstream: $upstream_addr '
                            'response_time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log loadbalancer;

    # TCP Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Buffer & Timeout Limits (Prevents Slowloris & Buffer Overflow Crashes)
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_max_body_size 50M; # Accommodates raw .eml threat attachments
    reset_timedout_connection on;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Distributed Rate Limiting & Concurrency Zones (Crash & DDoS Prevention)
    # 1. General API limit: 50 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=50r/s;
    # 2. Strict Auth / Login limit: 5 requests/sec per IP to prevent brute-force exhaustion
    limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/s;
    # 3. Connection limit: Max 30 simultaneous open connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream API Cluster (Load-balanced multi-instance backends)
    upstream sentineltrace_api_cluster {
        least_conn; # Routes traffic to least-busy backend worker
        server api-1:8000 max_fails=3 fail_timeout=10s;
        server api-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 64; # Maintain pooled persistent connections to backend
    }

    server {
        listen 80;
        server_name _;

        # Enforce connection limits per client IP
        limit_conn conn_limit 30;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Resilient Failover: Automatically re-route failed requests to another backend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Health Check Endpoint (Bypasses rate limiting for monitoring)
        location = /health {
            proxy_pass http://sentineltrace_api_cluster/health;
            access_log off;
        }

        # Auth Endpoints — Strict Rate Limiting to prevent CPU-intensive argon2 hashing starvation
        location ~ ^/api/v1/auth/(login|register|refresh)$ {
            limit_req zone=auth_strict_limit burst=10 nodelay;
            proxy_pass http://sentineltrace_api_cluster;
        }

        # SSE / Real-Time Events (Streaming without proxy buffering)
        location /api/v1/events {
            limit_req zone=api_general_limit burst=30 nodelay;
            proxy_pass http://sentineltrace_api_cluster;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }

        # General API Traffic
        location /api/ {
            limit_req zone=api_general_limit burst=40 nodelay;
            proxy_pass http://sentineltrace_api_cluster;
        }

        # Default Catch-all
        location / {
            limit_req zone=api_general_limit burst=50 nodelay;
            proxy_pass http://sentineltrace_api_cluster;
        }
    }
}
