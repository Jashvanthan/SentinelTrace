<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="neonHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="coreRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <radialGradient id="glowBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Disc -->
  <rect width="100" height="100" rx="20" fill="#090d16" />
  <circle cx="50" cy="50" r="42" fill="url(#glowBack)" />

  <!-- Outer Hexagon Cyber Shield Frame -->
  <polygon points="50,10 85,28 85,72 50,90 15,72 15,28" stroke="url(#neonHex)" stroke-width="4" stroke-linejoin="round" fill="#0c121e" filter="url(#neonGlow)" />
  
  <!-- Inner Hexagon Accent Line -->
  <polygon points="50,16 79,32 79,68 50,84 21,68 21,32" stroke="#00f2fe" stroke-width="1.5" stroke-linejoin="round" opacity="0.6" />

  <!-- Central Radar Circle Grid -->
  <circle cx="50" cy="50" r="26" stroke="#00c6ff" stroke-width="2" fill="#060a12" opacity="0.9" />
  <circle cx="50" cy="50" r="18" stroke="#0072ff" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="50" cy="50" r="10" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
  <circle cx="50" cy="50" r="3.5" fill="#00f2fe" filter="url(#neonGlow)" />

  <!-- Radar Crosshairs -->
  <line x1="24" y1="50" x2="76" y2="50" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />
  <line x1="50" y1="24" x2="50" y2="76" stroke="#00f2fe" stroke-width="1.5" opacity="0.8" />

  <!-- Radar Sweep Pulse Slice -->
  <path d="M50 50 L68 32 A 26 26 0 0 0 50 24 Z" fill="#00f2fe" opacity="0.35" />
  <line x1="50" y1="50" x2="68" y2="32" stroke="#ffffff" stroke-width="1.8" opacity="0.95" />
</svg>